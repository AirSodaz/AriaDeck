name: Package & Sign

on:
  workflow_call:
    inputs:
      build_channel:
        required: true
        type: string
      build_number:
        required: false
        default: ""
        type: string
      assert_version_tag:
        required: false
        default: false
        type: boolean
      tag:
        required: false
        default: ""
        type: string
      sign_windows:
        required: false
        default: false
        type: boolean
      publish_release:
        required: false
        default: false
        type: boolean
    secrets:
      ARIADECK_UPDATE_SIGNING_KEY:
        required: true
      ARIADECK_SIGN_TOOL:
        required: false
      ARIADECK_SIGN_CERT_THUMBPRINT:
        required: false
      ARIADECK_SIGN_PFX:
        required: false
      ARIADECK_SIGN_PFX_PASSWORD:
        required: false

env:
  CARGO_TERM_COLOR: always
  ARIADECK_BUILD_CHANNEL: ${{ inputs.build_channel }}
  ARIADECK_BUILD_NUMBER: ${{ inputs.build_number }}
  LINUXDEPLOY_URL: https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
  LINUXDEPLOY_SHA256: c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d

jobs:
  windows-packages:
    name: Windows ${{ matrix.arch }} packages
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    env:
      ARIADECK_UPDATE_PUBLIC_KEY: ${{ vars.ARIADECK_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v5

      - name: Require update verification key
        shell: pwsh
        run: if (-not $env:ARIADECK_UPDATE_PUBLIC_KEY) { throw "Set the ARIADECK_UPDATE_PUBLIC_KEY repository variable" }

      - name: Assert version tag
        if: inputs.assert_version_tag
        shell: pwsh
        run: |
          $toml = Get-Content Cargo.toml -Raw
          if ($toml -notmatch '\[workspace\.package\][\s\S]*?version\s*=\s*"([^"]+)"') { throw "Cannot read workspace version" }
          if ($env:GITHUB_REF_NAME -ne "v$($Matches[1])") { throw "Tag does not match workspace version $($Matches[1])" }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          targets: ${{ matrix.target }}

      - name: Add Rust target
        shell: pwsh
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-${{ matrix.arch }}
          shared-key: workspace

      - name: Generate third-party notices
        run: python scripts/gen_third_party_notices.py

      - name: Package portable (x64)
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          if ("${{ inputs.sign_windows }}" -eq "true" -and ($env:ARIADECK_SIGN_CERT_THUMBPRINT -or $env:ARIADECK_SIGN_PFX)) {
            ./scripts/package-windows-portable.ps1 -Arch x64 -Sign
          } else {
            ./scripts/package-windows-portable.ps1 -Arch x64
          }
        env:
          ARIADECK_SIGN_TOOL: ${{ secrets.ARIADECK_SIGN_TOOL }}
          ARIADECK_SIGN_CERT_THUMBPRINT: ${{ secrets.ARIADECK_SIGN_CERT_THUMBPRINT }}
          ARIADECK_SIGN_PFX: ${{ secrets.ARIADECK_SIGN_PFX }}
          ARIADECK_SIGN_PFX_PASSWORD: ${{ secrets.ARIADECK_SIGN_PFX_PASSWORD }}
          ARIADECK_SIGN_DESCRIPTION: AriaDeck

      - name: Stage binaries (arm64)
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          if ("${{ inputs.sign_windows }}" -eq "true" -and ($env:ARIADECK_SIGN_CERT_THUMBPRINT -or $env:ARIADECK_SIGN_PFX)) {
            ./scripts/package-windows-portable.ps1 -Arch arm64 -SkipZip -Sign
          } else {
            ./scripts/package-windows-portable.ps1 -Arch arm64 -SkipZip
          }
        env:
          ARIADECK_SIGN_TOOL: ${{ secrets.ARIADECK_SIGN_TOOL }}
          ARIADECK_SIGN_CERT_THUMBPRINT: ${{ secrets.ARIADECK_SIGN_CERT_THUMBPRINT }}
          ARIADECK_SIGN_PFX: ${{ secrets.ARIADECK_SIGN_PFX }}
          ARIADECK_SIGN_PFX_PASSWORD: ${{ secrets.ARIADECK_SIGN_PFX_PASSWORD }}
          ARIADECK_SIGN_DESCRIPTION: AriaDeck

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "choco install innosetup failed (exit $LASTEXITCODE); retrying once..."
            choco install innosetup --no-progress -y --force
          }
          if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed (exit $LASTEXITCODE)" }
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found after installing Inno Setup" }
          Write-Host "ISCC: $iscc"

      - name: Ensure WiX Toolset
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $wixFound = @(
            (Get-Command candle -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -ErrorAction SilentlyContinue),
            "${env:ProgramFiles(x86)}\WiX Toolset v3.11\bin\candle.exe",
            "$env:ProgramFiles\WiX Toolset v3.11\bin\candle.exe",
            "$env:WIX\bin\candle.exe"
          ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $wixFound) {
            choco install wixtoolset --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "choco install wixtoolset failed (exit $LASTEXITCODE)" }
          }

      - name: Package installer and MSI
        shell: pwsh
        run: |
          $packageArgs = @("-Arch", "${{ matrix.arch }}", "-SkipStage")
          if ("${{ inputs.sign_windows }}" -eq "true" -and ($env:ARIADECK_SIGN_CERT_THUMBPRINT -or $env:ARIADECK_SIGN_PFX)) {
            $packageArgs += "-Sign"
          }
          ./scripts/package-windows-installer.ps1 @packageArgs
        env:
          ARIADECK_SIGN_TOOL: ${{ secrets.ARIADECK_SIGN_TOOL }}
          ARIADECK_SIGN_CERT_THUMBPRINT: ${{ secrets.ARIADECK_SIGN_CERT_THUMBPRINT }}
          ARIADECK_SIGN_PFX: ${{ secrets.ARIADECK_SIGN_PFX }}
          ARIADECK_SIGN_PFX_PASSWORD: ${{ secrets.ARIADECK_SIGN_PFX_PASSWORD }}
          ARIADECK_SIGN_DESCRIPTION: AriaDeck

      - name: Verify Windows package artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = Get-ChildItem -Path dist -Filter "*_${{ matrix.arch }}-setup.exe" -File -ErrorAction SilentlyContinue
          $msi = Get-ChildItem -Path dist -Filter "*_${{ matrix.arch }}_en-US.msi" -File -ErrorAction SilentlyContinue
          if (-not $setup) { throw "Missing Inno setup.exe for ${{ matrix.arch }} under dist/" }
          if (-not $msi) { throw "Missing WiX MSI for ${{ matrix.arch }} under dist/" }
          if ("${{ matrix.arch }}" -eq "x64") {
            $zip = Get-ChildItem -Path dist -Filter "*_windows-x64-portable.zip" -File -ErrorAction SilentlyContinue
            if (-not $zip) { throw "Missing portable zip under dist/" }
          }
          # Staging dir is only an installer input; ship packages only.
          Get-ChildItem -Path dist -Directory -Filter "*_windows-*-portable" -ErrorAction SilentlyContinue |
            Remove-Item -Recurse -Force

      - name: Upload Windows packages
        uses: actions/upload-artifact@v6
        with:
          name: ariadeck-windows-${{ matrix.arch }}
          path: |
            dist/*_windows-x64-portable.zip
            dist/*_${{ matrix.arch }}-setup.exe
            dist/*_${{ matrix.arch }}_en-US.msi
          if-no-files-found: warn

  linux-packages:
    name: Linux packages (AppImage + deb + rpm)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      ARIADECK_UPDATE_PUBLIC_KEY: ${{ vars.ARIADECK_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v5

      - name: Require update verification key
        run: test -n "$ARIADECK_UPDATE_PUBLIC_KEY"

      - name: Assert version tag
        if: inputs.assert_version_tag
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test "$GITHUB_REF_NAME" = "v$version"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake desktop-file-utils dpkg-dev file \
            libasound2-dev libdbus-1-dev libfontconfig-dev libfuse2 libgtk-3-dev \
            libssl-dev libvulkan1 libwayland-dev libx11-xcb-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libzstd-dev libayatana-appindicator3-dev \
            libsecret-1-dev pkg-config rpm squashfs-tools

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"

      - uses: Swatinem/rust-cache@v2
        with:
          key: ubuntu-22.04
          shared-key: workspace

      - run: python3 scripts/gen_third_party_notices.py
      - run: cargo build --locked -p ariadeck-desktop --release

      - name: Download and verify linuxdeploy
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$LINUXDEPLOY_URL" --output "$RUNNER_TEMP/linuxdeploy-x86_64.AppImage"
          printf '%s  %s\n' "$LINUXDEPLOY_SHA256" "$RUNNER_TEMP/linuxdeploy-x86_64.AppImage" | sha256sum --check
          chmod +x "$RUNNER_TEMP/linuxdeploy-x86_64.AppImage"

      - name: Package and verify Linux artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          bash scripts/package-linux.sh "$version" "$RUNNER_TEMP/linuxdeploy-x86_64.AppImage"

      - uses: actions/upload-artifact@v6
        with:
          name: ariadeck-linux-x64
          path: |
            dist/*_amd64.AppImage
            dist/*_amd64.deb
            dist/*_x86_64.rpm
          if-no-files-found: error

  macos-packages:
    name: macOS ${{ matrix.arch }} packages
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      ARIADECK_UPDATE_PUBLIC_KEY: ${{ vars.ARIADECK_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v5

      - name: Require update verification key
        run: test -n "$ARIADECK_UPDATE_PUBLIC_KEY"

      - name: Assert version tag
        if: inputs.assert_version_tag
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test "$GITHUB_REF_NAME" = "v$version"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-${{ matrix.arch }}
          shared-key: workspace

      - run: python3 scripts/gen_third_party_notices.py
      - run: cargo build --locked -p ariadeck-desktop --release
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"

      - name: Package and verify macOS app
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          bash scripts/package-macos.sh "$version" "${{ matrix.arch }}"

      - uses: actions/upload-artifact@v6
        with:
          name: ariadeck-macos-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.app.tar.gz
          if-no-files-found: error

  sign-and-publish:
    name: Sign packages & verify checksums
    runs-on: ubuntu-latest
    needs: [windows-packages, linux-packages, macos-packages]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      - name: Install minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign

      - name: Sign packages with Minisign and create .sig
        shell: bash
        env:
          ARIADECK_UPDATE_SIGNING_KEY: ${{ secrets.ARIADECK_UPDATE_SIGNING_KEY }}
          ARIADECK_UPDATE_PUBLIC_KEY: ${{ vars.ARIADECK_UPDATE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          mapfile -t packages < <(find dist -maxdepth 1 -type f \
            \( -name '*.rpm' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.app.tar.gz' -o -name '*-setup.exe' -o -name '*.msi' \) -print | sort)
          test "${#packages[@]}" -eq 9 || { echo "Expected 9 signed package files, found ${#packages[@]}" >&2; exit 1; }
          bash scripts/sign-artifacts.sh "${packages[@]}"

      - name: Generate updater.json manifest
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.tag }}" ]]; then
            python3 scripts/generate_updater_manifest.py --dist-dir dist --tag "${{ inputs.tag }}"
          else
            python3 scripts/generate_updater_manifest.py --dist-dir dist
          fi

      - name: Verify artifacts and write SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          required_patterns=(
            '*_x86_64.rpm' '*_x86_64.rpm.sig'
            '*_amd64.deb' '*_amd64.deb.sig'
            '*_amd64.AppImage' '*_amd64.AppImage.sig'
            '*_aarch64.dmg'
            '*_x64.dmg'
            '*_aarch64.app.tar.gz' '*_aarch64.app.tar.gz.sig'
            '*_x64.app.tar.gz' '*_x64.app.tar.gz.sig'
            '*_arm64-setup.exe' '*_arm64-setup.exe.sig'
            '*_x64-setup.exe' '*_x64-setup.exe.sig'
            '*_arm64_en-US.msi' '*_arm64_en-US.msi.sig'
            '*_x64_en-US.msi' '*_x64_en-US.msi.sig'
            '*_windows-x64-portable.zip'
            'updater.json'
          )
          for pattern in "${required_patterns[@]}"; do
            count="$(find dist -maxdepth 1 -type f -name "$pattern" | wc -l)"
            if [[ "$count" -ne 1 ]]; then
              echo "Expected exactly one artifact matching $pattern, found $count" >&2
              exit 1
            fi
          done
          (cd dist && sha256sum $(find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%P\n' | sort) > SHA256SUMS.txt)
          (cd dist && sha256sum --check SHA256SUMS.txt)
          test "$(find dist -maxdepth 1 -type f -name '*.sig' | wc -l)" -eq 9

      - name: Upload signed CI packages
        if: ${{ !inputs.publish_release }}
        uses: actions/upload-artifact@v6
        with:
          name: ariadeck-all-platforms-signed
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub Release
        if: inputs.publish_release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body: |
            AriaDeck release assets include:
            - **Linux**: x86_64 RPM, amd64 DEB, and amd64 AppImage (each with `.sig` signature).
            - **macOS**: aarch64 and x64 DMGs, plus updater `app.tar.gz` packages (with `.sig` signatures).
            - **Windows**: x64 and arm64 setup installers, and x64/arm64 MSI packages (each with `.sig` signature), plus portable zip.
            - **Universal**: `updater.json` update manifest and `SHA256SUMS.txt` checksum list.

            Install packages directly or use the automated updater. Verify signatures using Minisign and the published update public key.
          generate_release_notes: true
