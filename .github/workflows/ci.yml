name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CARGO_INCREMENTAL: "0"
  ARIADECK_BUILD_CHANNEL: ci
  ARIADECK_BUILD_NUMBER: ${{ github.run_number }}

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      # Node 24-native actions (avoids Node 20 deprecation force-upgrade warnings).
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euxo pipefail
          sudo apt-get update
          # GPUI / desktop (subset of Zed script/linux) + tray / notify / keyring.
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            cmake \
            libasound2-dev \
            libdbus-1-dev \
            libfontconfig-dev \
            libgtk-3-dev \
            libssl-dev \
            libvulkan1 \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libzstd-dev \
            pkg-config \
            libayatana-appindicator3-dev \
            libsecret-1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy

      # Pinned like the Rust toolchain: the extension tests use node:test and the
      # glob form of --test, so the version needs to be known, not inherited.
      - name: Install Node
        if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Keep caches distinct per OS (and shared key space per workflow job).
          key: ${{ matrix.os }}
          shared-key: workspace

      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check

      - name: Test
        run: cargo test --workspace

      # The extension mirrors the host's payload limits (D-045 §3) and its
      # manifest carries the §7 permission boundary and the icon set; all three
      # fail quietly when wrong, so these pin them. One OS is enough — the code
      # under test is platform-independent.
      - name: Test browser extension
        if: matrix.os == 'ubuntu-latest'
        run: node --test "apps/ariadeck-extension/*.test.js"

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # D-045: the native messaging host is launched by the browser and must stay a
      # small, UI-free binary. A stray dependency edge would pull the whole GPUI
      # stack into it, so assert the boundary rather than trusting review.
      - name: Assert bridge links no GPUI
        shell: bash
        run: |
          set -euo pipefail
          if cargo tree -p ariadeck-bridge --edges normal --prefix none | grep -q '^gpui'; then
            echo "ariadeck-bridge must not depend on GPUI (D-045)" >&2
            cargo tree -p ariadeck-bridge --edges normal --invert gpui >&2 || true
            exit 1
          fi

      - name: Release build (desktop + bridge)
        run: cargo build -p ariadeck-desktop -p ariadeck-bridge --release

      - name: Verify Windows DPI manifest and reparse guards
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/verify-windows-a3.ps1 -SkipBuild

  package:
    name: Build & sign main packages
    needs: verify
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
    uses: ./.github/workflows/_package.yml
    with:
      build_channel: ci
      build_number: ${{ github.run_number }}
      assert_version_tag: false
      sign_windows: false
      publish_release: false
    secrets:
      ARIADECK_UPDATE_SIGNING_KEY: ${{ secrets.ARIADECK_UPDATE_SIGNING_KEY }}
