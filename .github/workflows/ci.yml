name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CARGO_INCREMENTAL: "0"
  ARIADECK_BUILD_CHANNEL: ci
  ARIADECK_BUILD_NUMBER: ${{ github.run_number }}

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      # Node 24-native actions (avoids Node 20 deprecation force-upgrade warnings).
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euxo pipefail
          sudo apt-get update
          # GPUI / desktop (subset of Zed script/linux) + tray / notify / keyring.
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            cmake \
            libasound2-dev \
            libdbus-1-dev \
            libfontconfig-dev \
            libgtk-3-dev \
            libssl-dev \
            libvulkan1 \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libzstd-dev \
            pkg-config \
            libayatana-appindicator3-dev \
            libsecret-1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      # Pinned like the Rust toolchain: the extension tests use node:test and the
      # glob form of --test, so the version needs to be known, not inherited.
      - name: Install Node
        if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Keep caches distinct per OS (and shared key space per workflow job).
          key: ${{ matrix.os }}
          shared-key: workspace

      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check

      - name: Test
        run: cargo test --workspace

      # The extension mirrors the host's payload limits (D-045 §3) and its
      # manifest carries the §7 permission boundary and the icon set; all three
      # fail quietly when wrong, so these pin them. One OS is enough — the code
      # under test is platform-independent.
      - name: Test browser extension
        if: matrix.os == 'ubuntu-latest'
        run: node --test "apps/ariadeck-extension/*.test.js"

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # D-045: the native messaging host is launched by the browser and must stay a
      # small, UI-free binary. A stray dependency edge would pull the whole GPUI
      # stack into it, so assert the boundary rather than trusting review.
      - name: Assert bridge links no GPUI
        shell: bash
        run: |
          set -euo pipefail
          if cargo tree -p ariadeck-bridge --edges normal --prefix none | grep -q '^gpui'; then
            echo "ariadeck-bridge must not depend on GPUI (D-045)" >&2
            cargo tree -p ariadeck-bridge --edges normal --invert gpui >&2 || true
            exit 1
          fi

      - name: Release build (desktop + bridge)
        run: cargo build -p ariadeck-desktop -p ariadeck-bridge --release

      - name: Verify Windows DPI manifest and reparse guards
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/verify-windows-a3.ps1 -SkipBuild

  windows-packages:
    name: Windows ${{ matrix.arch }} packages
    runs-on: windows-latest
    needs: verify
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    env:
      ARIADECK_UPDATE_PUBLIC_KEY: ${{ vars.ARIADECK_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          targets: ${{ matrix.target }}

      - name: Add Rust target
        shell: pwsh
        run: rustup target add ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-${{ matrix.arch }}
          shared-key: workspace

      - name: Generate third-party notices
        run: python scripts/gen_third_party_notices.py

      - name: Require update verification key
        shell: pwsh
        run: if (-not $env:ARIADECK_UPDATE_PUBLIC_KEY) { throw "Set the ARIADECK_UPDATE_PUBLIC_KEY repository variable" }

      - name: Package portable (x64)
        if: matrix.arch == 'x64'
        shell: pwsh
        run: ./scripts/package-windows-portable.ps1 -Arch x64

      - name: Stage binaries (arm64)
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: ./scripts/package-windows-portable.ps1 -Arch arm64 -SkipZip

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "choco install innosetup failed (exit $LASTEXITCODE); retrying once..."
            choco install innosetup --no-progress -y --force
          }
          if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed (exit $LASTEXITCODE)" }
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found after installing Inno Setup" }
          Write-Host "ISCC: $iscc"

      - name: Package installer and MSI
        shell: pwsh
        run: ./scripts/package-windows-installer.ps1 -Arch ${{ matrix.arch }} -SkipStage

      - name: Verify Windows package artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = Get-ChildItem -Path dist -Filter "*_${{ matrix.arch }}-setup.exe" -File -ErrorAction SilentlyContinue
          $msi = Get-ChildItem -Path dist -Filter "*_${{ matrix.arch }}_en-US.msi" -File -ErrorAction SilentlyContinue
          if (-not $setup) { throw "Missing Inno setup.exe for ${{ matrix.arch }} under dist/" }
          if (-not $msi) { throw "Missing WiX MSI for ${{ matrix.arch }} under dist/" }
          if ("${{ matrix.arch }}" -eq "x64") {
            $zip = Get-ChildItem -Path dist -Filter "*_windows-x64-portable.zip" -File -ErrorAction SilentlyContinue
            if (-not $zip) { throw "Missing portable zip under dist/" }
          }
          # Staging dir is only an installer input; ship packages only.
          Get-ChildItem -Path dist -Directory -Filter "*_windows-*-portable" -ErrorAction SilentlyContinue |
            Remove-Item -Recurse -Force

      - name: Upload Windows packages
        uses: actions/upload-artifact@v6
        with:
          name: ariadeck-windows-${{ matrix.arch }}
          path: |
            dist/*_windows-x64-portable.zip
            dist/*_${{ matrix.arch }}-setup.exe
            dist/*_${{ matrix.arch }}_en-US.msi
          if-no-files-found: warn

  linux-packages:
    name: Linux packages (AppImage + deb + rpm)
    runs-on: ubuntu-22.04
    needs: verify
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    env:
      ARIADECK_UPDATE_PUBLIC_KEY: ${{ vars.ARIADECK_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v5
      - name: Require update verification key
        run: test -n "$ARIADECK_UPDATE_PUBLIC_KEY"
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake desktop-file-utils dpkg-dev file \
            libasound2-dev libdbus-1-dev libfontconfig-dev libfuse2 libgtk-3-dev \
            libssl-dev libvulkan1 libwayland-dev libx11-xcb-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libzstd-dev libayatana-appindicator3-dev \
            libsecret-1-dev pkg-config rpm squashfs-tools
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ubuntu-22.04
          shared-key: workspace
      - run: python3 scripts/gen_third_party_notices.py
      - run: cargo build --locked -p ariadeck-desktop --release
      - name: Download linuxdeploy
        run: |
          curl --fail --location --retry 3 https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage --output "$RUNNER_TEMP/linuxdeploy-x86_64.AppImage"
          chmod +x "$RUNNER_TEMP/linuxdeploy-x86_64.AppImage"
      - name: Package and verify Linux artifacts
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = \"\([^\"]*\)\"/\1/p' Cargo.toml | head -n 1)"
          bash scripts/package-linux.sh "$version" "$RUNNER_TEMP/linuxdeploy-x86_64.AppImage"
      - uses: actions/upload-artifact@v6
        with:
          name: ariadeck-linux-x64
          path: |
            dist/*_amd64.AppImage
            dist/*_amd64.deb
            dist/*_x86_64.rpm
          if-no-files-found: error

  macos-packages:
    name: macOS ${{ matrix.arch }} packages
    needs: verify
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      ARIADECK_UPDATE_PUBLIC_KEY: ${{ vars.ARIADECK_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v5
      - name: Require update verification key
        run: test -n "$ARIADECK_UPDATE_PUBLIC_KEY"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-${{ matrix.arch }}
          shared-key: workspace
      - run: python3 scripts/gen_third_party_notices.py
      - run: cargo build --locked -p ariadeck-desktop --release
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
      - name: Package and verify macOS app
        run: bash scripts/package-macos.sh "$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = \"\([^\"]*\)\"/\1/p' Cargo.toml | head -n 1)" "${{ matrix.arch }}"
      - uses: actions/upload-artifact@v6
        with:
          name: ariadeck-macos-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.app.tar.gz
          if-no-files-found: error

  sign-main-packages:
    name: Sign main CI packages
    runs-on: ubuntu-latest
    needs: [windows-packages, linux-packages, macos-packages]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true
      - name: Install minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y minisign
      - name: Sign packages with Minisign and create .sig
        shell: bash
        env:
          ARIADECK_UPDATE_SIGNING_KEY: ${{ secrets.ARIADECK_UPDATE_SIGNING_KEY }}
          ARIADECK_UPDATE_PUBLIC_KEY: ${{ vars.ARIADECK_UPDATE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          mapfile -t packages < <(find dist -maxdepth 1 -type f \
            \( -name '*.rpm' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.app.tar.gz' -o -name '*-setup.exe' -o -name '*.msi' \) -print | sort)
          test "${#packages[@]}" -eq 9 || { echo "Expected 9 signed package files, found ${#packages[@]}" >&2; exit 1; }
          bash scripts/sign-artifacts.sh "${packages[@]}"
      - name: Generate updater.json manifest
        run: python3 scripts/generate_updater_manifest.py --dist-dir dist
      - name: Verify artifacts and write SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          required_patterns=(
            '*_x86_64.rpm' '*_x86_64.rpm.sig'
            '*_amd64.deb' '*_amd64.deb.sig'
            '*_amd64.AppImage' '*_amd64.AppImage.sig'
            '*_aarch64.dmg'
            '*_x64.dmg'
            '*_aarch64.app.tar.gz' '*_aarch64.app.tar.gz.sig'
            '*_x64.app.tar.gz' '*_x64.app.tar.gz.sig'
            '*_arm64-setup.exe' '*_arm64-setup.exe.sig'
            '*_x64-setup.exe' '*_x64-setup.exe.sig'
            '*_arm64_en-US.msi' '*_arm64_en-US.msi.sig'
            '*_x64_en-US.msi' '*_x64_en-US.msi.sig'
            'updater.json'
          )
          for pattern in "${required_patterns[@]}"; do
            count="$(find dist -maxdepth 1 -type f -name "$pattern" | wc -l)"
            if [[ "$count" -ne 1 ]]; then
              echo "Expected exactly one artifact matching $pattern, found $count" >&2
              exit 1
            fi
          done
          (cd dist && sha256sum $(find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%P\n' | sort) > SHA256SUMS.txt)
          (cd dist && sha256sum --check SHA256SUMS.txt)
          test "$(find dist -maxdepth 1 -type f -name '*.sig' | wc -l)" -eq 9
      - uses: actions/upload-artifact@v6
        with:
          name: ariadeck-all-platforms-signed
          path: dist/*
          if-no-files-found: error
