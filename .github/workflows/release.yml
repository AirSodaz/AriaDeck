name: Release
on:
  push:
    tags: ["v*"]
env:
  CARGO_TERM_COLOR: always
  ARIADECK_BUILD_CHANNEL: release
jobs:
  windows-package:
    name: Windows release packages
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Assert version tag
        shell: pwsh
        run: |
          $toml = Get-Content Cargo.toml -Raw
          if ($toml -notmatch '\[workspace\.package\][\s\S]*?version\s*=\s*"([^"]+)"') { throw "Cannot read workspace version" }
          if ($env:GITHUB_REF_NAME -ne "v$($Matches[1])") { throw "Tag does not match workspace version $($Matches[1])" }
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96"
      - uses: Swatinem/rust-cache@v2
      - run: python scripts/gen_third_party_notices.py
      - name: Package portable
        shell: pwsh
        run: |
          if ($env:ARIADECK_SIGN_CERT_THUMBPRINT -or $env:ARIADECK_SIGN_PFX) { ./scripts/package-windows-portable.ps1 -Sign }
          else { ./scripts/package-windows-portable.ps1 }
        env:
          ARIADECK_SIGN_TOOL: ${{ secrets.ARIADECK_SIGN_TOOL }}
          ARIADECK_SIGN_CERT_THUMBPRINT: ${{ secrets.ARIADECK_SIGN_CERT_THUMBPRINT }}
          ARIADECK_SIGN_PFX: ${{ secrets.ARIADECK_SIGN_PFX }}
          ARIADECK_SIGN_PFX_PASSWORD: ${{ secrets.ARIADECK_SIGN_PFX_PASSWORD }}
          ARIADECK_SIGN_DESCRIPTION: AriaDeck
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "choco install innosetup failed (exit $LASTEXITCODE); retrying once..."
            choco install innosetup --no-progress -y --force
          }
          if ($LASTEXITCODE -ne 0) { throw "choco install innosetup failed (exit $LASTEXITCODE)" }
          $iscc = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found after installing Inno Setup" }
      - name: Package installer
        shell: pwsh
        run: |
          $packageArgs = @("-SkipStage")
          if ($env:ARIADECK_SIGN_CERT_THUMBPRINT -or $env:ARIADECK_SIGN_PFX) { $packageArgs += "-Sign" }
          ./scripts/package-windows-installer.ps1 @packageArgs
        env:
          ARIADECK_SIGN_TOOL: ${{ secrets.ARIADECK_SIGN_TOOL }}
          ARIADECK_SIGN_CERT_THUMBPRINT: ${{ secrets.ARIADECK_SIGN_CERT_THUMBPRINT }}
          ARIADECK_SIGN_PFX: ${{ secrets.ARIADECK_SIGN_PFX }}
          ARIADECK_SIGN_PFX_PASSWORD: ${{ secrets.ARIADECK_SIGN_PFX_PASSWORD }}
          ARIADECK_SIGN_DESCRIPTION: AriaDeck
      - name: Verify Windows packages
        shell: pwsh
        run: |
          if (-not (Get-ChildItem dist -Filter "*-windows-x64-portable.zip" -File)) { throw "Missing portable zip" }
          if (-not (Get-ChildItem dist -Filter "*-windows-x64-setup.exe" -File)) { throw "Missing setup exe" }
          Get-ChildItem dist -Directory -Filter "*-windows-x64-portable" | Remove-Item -Recurse -Force
      - uses: actions/upload-artifact@v6
        with:
          name: ariadeck-windows-x64
          path: |
            dist/*-windows-x64-portable.zip
            dist/*-windows-x64-setup.exe

  linux-package:
    name: Linux x86_64 release packages
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Assert version tag
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake desktop-file-utils dpkg-dev file \
            libasound2-dev libdbus-1-dev libfontconfig-dev libfuse2 libgtk-3-dev \
            libssl-dev libvulkan1 libwayland-dev libx11-xcb-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libzstd-dev libayatana-appindicator3-dev \
            libsecret-1-dev pkg-config squashfs-tools
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ubuntu-22.04
          shared-key: workspace
      - run: python3 scripts/gen_third_party_notices.py
      - run: cargo build --locked -p ariadeck-desktop --release
      - name: Download linuxdeploy
        run: |
          curl --fail --location --retry 3 https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage --output "$RUNNER_TEMP/linuxdeploy-x86_64.AppImage"
          chmod +x "$RUNNER_TEMP/linuxdeploy-x86_64.AppImage"
      - name: Package and verify Linux artifacts
        run: bash scripts/package-linux.sh "$(printf '%s' "$GITHUB_REF_NAME" | sed 's/^v//')" "$RUNNER_TEMP/linuxdeploy-x86_64.AppImage"
      - uses: actions/upload-artifact@v6
        with:
          name: ariadeck-linux-x64
          path: |
            dist/AriaDeck-*-x86_64.AppImage
            dist/ariadeck_*_amd64.deb

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [windows-package, linux-package]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true
      - name: Verify artifacts and write SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail
          for pattern in '*-windows-x64-portable.zip' '*-windows-x64-setup.exe' 'AriaDeck-*-x86_64.AppImage' 'ariadeck_*_amd64.deb'; do
            count="$(find dist -maxdepth 1 -type f -name "$pattern" | wc -l)"
            if [[ "$count" -ne 1 ]]; then
              echo "Expected one artifact matching $pattern, found $count" >&2
              exit 1
            fi
          done
          (cd dist && sha256sum *.zip *-setup.exe *.AppImage *.deb > SHA256SUMS.txt)
          (cd dist && sha256sum --check SHA256SUMS.txt)
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.zip
            dist/*-setup.exe
            dist/*.AppImage
            dist/*.deb
            dist/SHA256SUMS.txt
          body: |
            AriaDeck is available for Windows x64 and Linux x86_64.
            Linux: make the x86_64 AppImage executable and run it; it requires a compatible GTK 3 desktop runtime.
            Alternatively, install the amd64 deb on Ubuntu/Debian.
            Install the deb with sudo apt install ./ariadeck_<ver>_amd64.deb.
            Windows packages are unsigned and may show SmartScreen; until signing is available, verify downloads against SHA256SUMS.txt.
            aria2 is not bundled. Import or download a core under Settings > Engine,
            or use ARIADECK_RPC_URL with ARIADECK_RPC_SECRET for an existing instance.
            Linux browser native messaging registration is not supported yet.
            Windows packaging and data-directory details: docs/release.md.
          generate_release_notes: true
